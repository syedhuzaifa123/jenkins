apiVersion: apps/v1
kind: Deployment
metadata:
  name: am-app
  labels:
    app: am-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: am-app
  template:
    metadata:
      labels:
        app: am-app
    spec: 
      containers:
      - name: am-app
        image: syedhuzaifafazal/am:replaceImageTag
        ports:
        - containerPort: 8080
