apiVersion: apps/v1
kind: Deployment
metadata:
  name: am-app
  labels:
    app: am-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: am-app
  template:
    metadata:
      labels:
        app: am-app
    spec: 
      containers:
      - name: am-app
        image: syedhuzaifafazal/am:29
        ports:
        - containerPort: 8080
        env:
          - name: SPRING_DATASOURCE_URL
            value: "jdbc:mysql://mysql-host-bridge:3306/AMS"
          - name: SPRING_DATASOURCE_USERNAME
            value: "root"
          - name: SPRING_DATASOURCE_PASSWORD
            value: "Admin@11"
