apiVersion: apps/v1
kind: Deployment
metadata:
  name: am-app
  namespace: gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: am-app
  template:
    metadata:
      labels:
        app: am-app
    spec:
      hostNetwork: true  # 🚀 Bypasses Flannel entirely to look at the host network
      containers:
      - name: am-app
        image: syedhuzaifafazal/am:28 # Matches your current build
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://192.168.1.237:3306/AMS" # Target your true host IP
        - name: SPRING_DATASOURCE_USERNAME
          value: "root"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "Admin@11"

